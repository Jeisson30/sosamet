<header class="header">
  <div class="header-inner">
    <!-- Col 1: menú (solo mobile) -->
    <div class="header-col header-col-menu">
      <button
        type="button"
        class="nav-hamburger"
        (click)="toggleMobileNav()"
        [attr.aria-expanded]="mobileNavOpen"
        aria-label="Abrir menú"
      >
        <i class="pi" [ngClass]="mobileNavOpen ? 'pi-times' : 'pi-bars'"></i>
      </button>
    </div>

    <!-- Col 2: logo (+ usuario debajo en mobile) -->
    <div class="header-col header-col-brand">
      <img
        src="assets/images/logo.png"
        alt="Sosamet"
        class="logo-img"
      />
      <span class="usuario-texto usuario-texto--under-logo">
        Usuario: {{ nombreUsuario }}
      </span>
    </div>

    <!-- Col 3: acciones (avatar; en desktop también el nombre) -->
    <div class="header-col header-col-actions">
      <span class="usuario-texto usuario-texto--beside-avatar">
        Usuario: {{ nombreUsuario }}
      </span>

      <p-menu #menu [model]="userMenu" popup baseZIndex="1000"></p-menu>

      <p-avatar
        label="{{ nombreUsuario[0] }}"
        shape="circle"
        styleClass="cursor-pointer user-avatar"
        [ngStyle]="{ 'background-color': '#2196f3', color: '#ffffff' }"
        (click)="menu.toggle($event)"
      ></p-avatar>
    </div>
  </div>
</header>
