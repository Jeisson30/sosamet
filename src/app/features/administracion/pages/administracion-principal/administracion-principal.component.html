<div class="adm-hub">
  <div class="adm-top-bar">
    <button type="button" class="btn-volver" (click)="volver()">
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
      <span>Volver</span>
    </button>
  </div>

  <header class="adm-hub-header">
    <h1 class="adm-greeting">Administración</h1>
    <p class="adm-subtitle">Gestión de constructoras, proyectos, amarre de contratos e insumos</p>
  </header>

  <div class="adm-grid">
    <article class="adm-card">
      <div class="adm-card-icon-wrap">
        <img
          class="adm-card-icon"
          src="assets/images/CONSTRUCTORA.png"
          alt="Constructoras"
        />
      </div>

      <h2 class="adm-card-title">Constructoras</h2>

      <div class="adm-card-actions">
        <button
          type="button"
          class="btn-card btn-card-gestionar"
          (click)="goToConstructoras()"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-building"></i>
          </span>
          <span>Gestionar</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>
      </div>
    </article>

    <article class="adm-card">
      <div class="adm-card-icon-wrap">
        <img
          class="adm-card-icon"
          src="assets/images/PROYECTO.png"
          alt="Proyectos"
        />
      </div>

      <h2 class="adm-card-title">Proyectos</h2>

      <div class="adm-card-actions">
        <button
          type="button"
          class="btn-card btn-card-gestionar"
          (click)="goToProyectos()"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-briefcase"></i>
          </span>
          <span>Gestionar</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>
      </div>
    </article>

    <article class="adm-card">
      <div class="adm-card-icon-wrap">
        <img
          class="adm-card-icon"
          src="assets/images/CONTRATOS.png"
          alt="Contratos"
        />
      </div>

      <h2 class="adm-card-title">Contratos</h2>

      <div class="adm-card-actions">
        <button
          type="button"
          class="btn-card btn-card-gestionar"
          (click)="goToContratos()"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-link"></i>
          </span>
          <span>Gestionar</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>
      </div>
    </article>

    <article class="adm-card">
      <div class="adm-card-icon-wrap">
        <img
          class="adm-card-icon"
          src="assets/images/DESCRIPCION.png"
          alt="Insumos"
        />
      </div>

      <h2 class="adm-card-title">Insumos</h2>

      <div class="adm-card-actions">
        <button
          type="button"
          class="btn-card btn-card-gestionar"
          (click)="goToInsumos()"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-box"></i>
          </span>
          <span>Gestionar</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>
      </div>
    </article>
  </div>
</div>
