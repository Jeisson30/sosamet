<div class="order-work-container">
  <div class="ow-title-row">
    <h2 class="login-title">Crear Orden de Trabajo</h2>
    <label class="vinculo-check">
      <input
        type="checkbox"
        [(ngModel)]="sinContrato"
        (change)="onSinContratoChange()"
      />
      Sin contrato
    </label>
  </div>

  <!-- Fila 1 -->
  <div class="form-grid row-1">
    <div class="field">
      <label for="consecutivo">Consecutivo</label>
      <input
        id="consecutivo"
        pInputText
        class="w-full"
        [(ngModel)]="consecutivo"
      />
    </div>

    <div class="field">
      <label for="tipoCorteOrderWork">Tipo Actividad</label>
      <p-dropdown
        inputId="tipoCorteOrderWork"
        [options]="tipoCorteOptions"
        [(ngModel)]="tipoCorte"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
    </div>

    <!--
    <div class="field">
      <label for="empresa">Empresa Asociada</label>
      <p-dropdown
        inputId="empresa"
        [options]="companies"
        [(ngModel)]="empresaSelectedId"
        optionLabel="nombre_empresa"
        optionValue="id"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
    </div>
    -->

    <div class="field">
      <label for="fechaEntrega">Fecha Entrega</label>
      <p-calendar
        inputId="fechaEntrega"
        [(ngModel)]="fechaEntrega"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        placeholder="dd/mm/aa"
        class="w-full"
      >
      </p-calendar>
    </div>

    <div class="field">
      <label for="encargado">Encargado</label>
      <p-dropdown
        inputId="encargado"
        [options]="workUsers"
        [(ngModel)]="userSelected"
        optionLabel="displayName"
        optionValue="id_usuario"
        [loading]="loadingUsers"
        [disabled]="loadingUsers"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
    </div>
  </div>

  <!-- Fila 2 -->
  <div class="form-grid row-2">
    <div class="field">
      <label for="constructora">Constructora</label>
      <p-dropdown
        inputId="constructora"
        [options]="constructorasOptions"
        [(ngModel)]="constructoraSelectedId"
        (onChange)="onConstructoraChange($event.value)"
        [filter]="true"
        filterPlaceholder="Buscar"
        [showClear]="true"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
    </div>

    <div class="field">
      <label for="proyecto">Proyecto</label>
      <p-dropdown
        inputId="proyecto"
        [options]="proyectosOptions"
        [(ngModel)]="proyectoSelectedId"
        (onChange)="onProyectoChange($event.value)"
        [filter]="true"
        filterPlaceholder="Buscar"
        [showClear]="true"
        [disabled]="!constructoraSelectedId"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
    </div>

    <div class="field">
      <label for="tipoConsecutivoOt">Tipo documento</label>
      <p-dropdown
        inputId="tipoConsecutivoOt"
        [options]="tipoConsecutivoOptions"
        [(ngModel)]="selectedTipoConsecutivo"
        (onChange)="onTipoConsecutivoChange($event.value)"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        [disabled]="!proyectoSelectedId"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
    </div>

    <div class="field">
      <label for="tipoDocumento">N° documento</label>
      <p-dropdown
        *ngIf="documentoNumeroOptions.length; else tipoDocInputOt"
        inputId="tipoDocumento"
        [options]="documentoNumeroOptions"
        [(ngModel)]="tipoDocumento"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        filterPlaceholder="Buscar N° documento"
        [showClear]="true"
        [disabled]="!proyectoSelectedId || !selectedTipoConsecutivo"
        placeholder="Seleccione N° documento"
        class="w-full"
      >
      </p-dropdown>
      <ng-template #tipoDocInputOt>
        <input
          id="tipoDocumento"
          pInputText
          class="w-full"
          [(ngModel)]="tipoDocumento"
          [disabled]="!proyectoSelectedId || !selectedTipoConsecutivo"
        />
      </ng-template>
    </div>

    <div class="field">
      <label [for]="sinContrato ? 'numeroCotizacionOt' : 'contrato'">
        {{ sinContrato ? 'N° Cotización' : 'Contrato' }}
      </label>
      <p-dropdown
        *ngIf="!sinContrato"
        inputId="contrato"
        [options]="contratosOptions"
        [(ngModel)]="contratoSelected"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        filterPlaceholder="Buscar"
        [showClear]="true"
        placeholder="Seleccione"
        class="w-full"
      >
      </p-dropdown>
      <input
        *ngIf="sinContrato"
        id="numeroCotizacionOt"
        pInputText
        class="w-full"
        [(ngModel)]="numeroCotizacion"
      />
    </div>
  </div>

  <!-- Fila 3 -->
  <div class="form-grid row-3">
    <div class="field">
      <label for="observaciones">Observaciones</label>
      <textarea
        id="observaciones"
        pInputTextarea
        rows="2"
        class="w-full"
        [(ngModel)]="observaciones"
      >
      </textarea>
    </div>

    <div class="field">
      <label for="autorizo">Autorizo</label>
      <input
        id="autorizo"
        pInputText
        class="w-full"
        [(ngModel)]="autorizo"
      />
    </div>
  </div>

  <!--
  <div class="form-button-row">
    <p-button
      label="Adjuntar Acta de Medida"
      icon="pi pi-paperclip"
      class="custom-btn"
      (onClick)="onAdjuntarActa()"
    >
    </p-button>

    <p-button
      label="Subir Archivo Excel"
      icon="pi pi-upload"
      class="custom-btn"
      (onClick)="fileInput.click()"
    >
    </p-button>

    <input
      #fileInput
      type="file"
      hidden
      accept=".xlsx,.xls"
      (change)="onFileSelected($event)"
    />
  </div>
  -->

  <!-- ================== DETALLE DE ITEMS ================== -->
  <div class="items-container">
    <div *ngIf="items.length === 0" class="empty-state">
      <p>No hay items cargados</p>
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Agregar Item"
        class="custom-btn"
        (click)="addItemRow()"
      ></button>
    </div>

    <div class="item-card" *ngFor="let row of items; let i = index; trackBy: trackByIndex">
      <div class="item-header">
        <span>Item {{ i + 1 }}</span>
      </div>

      <div class="items-row">
        <div class="item-field">
          <label>Ref</label>
          <input pInputText [(ngModel)]="row.ref" />
        </div>

        <div class="item-field">
          <label>Item</label>
          <input pInputText [(ngModel)]="row.item" />
        </div>

        <div class="item-field">
          <label>Cant</label>
          <input type="number" pInputText [(ngModel)]="row.cantidad" />
        </div>

        <div class="item-field">
          <label>UM</label>
          <input pInputText [(ngModel)]="row.um" />
        </div>

        <div class="item-field">
          <label>Ancho</label>
          <input type="number" pInputText [(ngModel)]="row.ancho" />
        </div>

        <div class="item-field">
          <label>Alto</label>
          <input type="number" pInputText [(ngModel)]="row.alto" />
        </div>

        <div class="item-field item-field--lg">
          <label>Descripción</label>
          <input pInputText [(ngModel)]="row.descripcion" />
        </div>

        <div class="item-field item-field--lg">
          <label>Observaciones</label>
          <input pInputText [(ngModel)]="row.observaciones" />
        </div>
      </div>

      <div class="item-actions">
        <button
          pButton
          type="button"
          icon="pi pi-plus"
          class="p-button-rounded btn-add"
          (click)="addItemRow()"
          *ngIf="i === items.length - 1"
          title="Agregar item"
        ></button>

        <button
          pButton
          type="button"
          icon="pi pi-trash"
          class="p-button-rounded btn-remove"
          *ngIf="items.length > 1"
          (click)="removeItemRow(i)"
          title="Eliminar item"
        ></button>
      </div>
    </div>
  </div>

  <!-- ================== ACCIONES ================== -->
  <div class="save-row">
    <p-button
      label="Previsualizar"
      icon="pi pi-eye"
      class="custom-btn"
      [disabled]="loading || generatingPdf"
      (onClick)="onPrevisualizar()"
    ></p-button>

    <p-button
      label="Generar PDF"
      icon="pi pi-file-pdf"
      class="custom-btn"
      [loading]="generatingPdf"
      [disabled]="loading || generatingPdf"
      (onClick)="onGenerarPdf()"
    ></p-button>

    <p-button
      label="Guardar"
      icon="pi pi-save"
      class="custom-btn"
      [loading]="loading"
      [disabled]="loading || generatingPdf"
      (onClick)="guardarOrden()"
    ></p-button>
  </div>

  <p-dialog
    [(visible)]="showPreview"
    header="Previsualización Orden de Trabajo"
    [modal]="true"
    [style]="{ width: '95vw', maxWidth: '920px' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="ot-preview-dialog"
    (onHide)="closePreview()"
  >
    <div class="ot-preview-wrap" *ngIf="showPreview">
      <div class="ot-preview-scale">
        <app-order-work-print-format
          [header]="pdfHeader"
          [items]="pdfItems"
        >
        </app-order-work-print-format>
      </div>
    </div>

    <div class="ot-preview-actions">
      <button
        pButton
        type="button"
        label="Cerrar"
        class="p-button-sm p-button-secondary"
        (click)="closePreview()"
      ></button>
    </div>
  </p-dialog>

  <!-- Render offscreen para exportar PDF sin desbordes del diálogo -->
  <div class="ot-pdf-offscreen" *ngIf="showPdfForExport">
    <app-order-work-print-format
      #orderWorkPrintExport
      [header]="pdfHeader"
      [items]="pdfItems"
    >
    </app-order-work-print-format>
  </div>
</div>
