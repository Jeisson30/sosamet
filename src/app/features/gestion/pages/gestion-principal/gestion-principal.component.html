<div class="produccion-hub">
  <header class="produccion-hub-header">
    <h1 class="produccion-greeting">
      Hola, <span>{{ nombreUsuario }}</span>!
    </h1>
    <p class="produccion-subtitle">Gestiona el proceso de producción y contratistas</p>
  </header>

  <div class="produccion-grid">
    <article class="produccion-card" *ngFor="let card of cards">
      <div class="produccion-card-icon-wrap">
        <img
          class="produccion-card-icon"
          [src]="card.icon"
          [alt]="card.title"
          (error)="onIconError($event)"
        />
      </div>

      <h2 class="produccion-card-title">{{ card.title }}</h2>

      <div class="produccion-card-actions">
        <button
          *ngIf="card.showNuevo"
          type="button"
          class="btn-card btn-card-nuevo"
          [disabled]="card.nuevoDisabled"
          (click)="onNuevo(card)"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-plus"></i>
          </span>
          <span>Nuevo</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>

        <button
          *ngIf="card.showConsultar"
          type="button"
          class="btn-card btn-card-consultar"
          [disabled]="card.consultarDisabled"
          (click)="onConsultar(card)"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-search"></i>
          </span>
          <span>Consultar</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>
      </div>
    </article>
  </div>
</div>
