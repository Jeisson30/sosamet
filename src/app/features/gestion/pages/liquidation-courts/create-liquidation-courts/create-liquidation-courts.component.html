<div class="liquidation-container">
  <div class="liq-title-row">
    <h2>Crear Liquidación de Corte</h2>
    <label class="vinculo-check">
      <input
        type="checkbox"
        [(ngModel)]="sinContrato"
      />
      Sin contrato
    </label>
  </div>

  <!-- Fila 1: Nombre corte, Consecutivo, Empresa asociada, Encargado -->
  <div class="form-grid row-1">
    <p-floatLabel>
      <input pInputText [(ngModel)]="nombreCorte" />
      <label>Nombre Corte</label>
    </p-floatLabel>

    <p-floatLabel>
      <input pInputText [(ngModel)]="consecutivo" />
      <label>Consecutivo</label>
    </p-floatLabel>

    <p-floatlabel variant="over" class="w-full">
      <p-dropdown
        inputId="tipoCorteLiquidacion"
        [options]="tipoCorteOptions"
        [(ngModel)]="tipoCorte"
        optionLabel="label"
        optionValue="value"
        class="w-full"
      >
      </p-dropdown>
      <label for="tipoCorteLiquidacion">Tipo de corte</label>
    </p-floatlabel>

    <p-floatLabel>
      <p-dropdown
        [options]="companies"
        [(ngModel)]="empresaSelectedId"
        optionLabel="nombre_empresa"
        optionValue="id"
        [loading]="loadingCompanies"
        [disabled]="loadingCompanies"
      >
      </p-dropdown>
      <label>Empresa Asociada</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-dropdown
        [options]="workUsers"
        [(ngModel)]="userSelected"
        optionLabel="displayName"
        optionValue="id_usuario"
        [loading]="loadingUsers"
        [disabled]="loadingUsers"
      >
      </p-dropdown>
      <label>Encargado</label>
    </p-floatLabel>
  </div>

  <!-- Fila 2: Observaciones (todo el ancho) -->
  <div class="form-grid row-2">
    <p-floatLabel class="full-width">
      <textarea pInputTextarea rows="3" [(ngModel)]="observaciones"></textarea>
      <label>Observaciones</label>
    </p-floatLabel>
  </div>

  <!-- Botón Subir Excel + nombre del archivo (sin input visible) -->
  <div class="form-button-row excel-upload-row">
    <p-button
      label="Subir Archivo Excel"
      icon="pi pi-upload"
      class="custom-btn"
      (onClick)="fileInput.click()"
    >
    </p-button>
    <span class="excel-file-name" *ngIf="selectedExcelFileName">{{ selectedExcelFileName }}</span>
    <input
      #fileInput
      type="file"
      hidden
      accept=".xlsx,.xls"
      (change)="onFileSelected($event)"
    />
  </div>

  <!-- ================== ITEMS ================== -->
  <div class="items-container">
    <div *ngIf="items.length === 0" class="empty-state">
      <p>No hay items cargados</p>
      <button
        pButton
        icon="pi pi-plus"
        label="Agregar Item"
        class="custom-btn"
        (click)="addItemRow()"
      ></button>
    </div>

    <div class="item-card" *ngFor="let row of items; let i = index">

  <div class="item-header">
    <span>Item {{ i + 1 }}</span>
  </div>

  <div class="items-row">
    <input pInputText placeholder="Ref" [(ngModel)]="row.ref" />
    <input pInputText placeholder="Insumo" [(ngModel)]="row.insumo" />
    <input pInputText placeholder="Proyecto" [(ngModel)]="row.obra" />
    <input
      pInputText
      [placeholder]="sinContrato ? 'N° Cotización' : 'Contrato No.'"
      [(ngModel)]="row.no_contrato"
    />
    <input pInputText placeholder="O.T." [(ngModel)]="row.no_orden" />
    <input pInputText placeholder="Item" [(ngModel)]="row.item" />
    <input
      pInputText
      placeholder="Tipo de actividad"
      [(ngModel)]="row.tipo_actividad"
    />
    <input
      pInputText
      placeholder="Detalle"
      [(ngModel)]="row.descripcion"
    />
    <input pInputText placeholder="Ubicación" [(ngModel)]="row.ubicacion" />

    <p-floatLabel>
      <input
        type="number"
        pInputText
        [(ngModel)]="row.cantidad"
        (ngModelChange)="calculateRowTotal(row)"
      />
      <label>Cant</label>
    </p-floatLabel>

    <input pInputText placeholder="UM" [(ngModel)]="row.um" />

    <p-floatLabel>
      <input type="number" pInputText [(ngModel)]="row.ancho" />
      <label>Ancho</label>
    </p-floatLabel>

    <p-floatLabel>
      <input type="number" pInputText [(ngModel)]="row.alto" />
      <label>Alto</label>
    </p-floatLabel>

    <p-floatLabel>
      <input type="number" pInputText [(ngModel)]="row.fondo" />
      <label>Fondo</label>
    </p-floatLabel>

    <input
      pInputText
      placeholder="Observaciones"
      [(ngModel)]="row.observaciones"
    />

    <p-floatLabel>
      <p-inputNumber
        [inputId]="'vr_unitario_' + i"
        [(ngModel)]="row.vr_unitario"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="calculateRowTotal(row)"
        styleClass="w-full"
      />
      <label [for]="'vr_unitario_' + i">Vr Unitario</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        [inputId]="'vr_total_' + i"
        [(ngModel)]="row.vr_total"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        [readonly]="true"
        styleClass="w-full"
      />
      <label [for]="'vr_total_' + i">Vr Total</label>
    </p-floatLabel>
  </div>

  <div class="item-actions">
    <button
      pButton
      icon="pi pi-plus"
      class="btn-add"
      (click)="addItemRow()"
      *ngIf="i === items.length - 1"
    >+</button>

    <button
      pButton
      icon="pi pi-trash"
      class="btn-remove"
      *ngIf="items.length > 1"
      (click)="removeItemRow(i)"
    >-</button>
  </div>

</div>

<!--  -->

  <!-- RESUMEN -->
  <hr/>
  <h2>Descuentos</h2>
  <div class="form-grid three-columns mt-5">
    <p-floatLabel>
      <p-inputNumber
        inputId="seguridad_social"
        [(ngModel)]="resumen.seguridad_social"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="calculateTotal()"
        styleClass="w-full"
      />
      <label for="seguridad_social">Seguridad Social</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        inputId="maquinaria_aseo"
        [(ngModel)]="resumen.maquinaria_aseo"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="onDescuentoManual('maquinaria_aseo')"
        styleClass="w-full"
      />
      <label for="maquinaria_aseo">Maquinaria y Aseo (10%)</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        inputId="casino"
        [(ngModel)]="resumen.casino"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="calculateTotal()"
        styleClass="w-full"
      />
      <label for="casino">Casino</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        inputId="retegarantia"
        [(ngModel)]="resumen.retegarantia"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="onDescuentoManual('retegarantia')"
        styleClass="w-full"
      />
      <label for="retegarantia">Retegarantía (5%)</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        inputId="prestamos"
        [(ngModel)]="resumen.prestamos"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="calculateTotal()"
        styleClass="w-full"
      />
      <label for="prestamos">Préstamos</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        inputId="otros"
        [(ngModel)]="resumen.otros"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        (ngModelChange)="calculateTotal()"
        styleClass="w-full"
      />
      <label for="otros">Otros</label>
    </p-floatLabel>

    <p-floatLabel>
      <p-inputNumber
        inputId="total"
        [(ngModel)]="resumen.total"
        mode="decimal"
        locale="es-CO"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [useGrouping]="true"
        [readonly]="true"
        styleClass="w-full"
      />
      <label for="total">Total</label>
    </p-floatLabel>
  </div>

  <!-- GUARDAR -->
  <div class="save-row">
    <p-button
      label="Guardar Liquidación"
      icon="pi pi-save"
      class="custom-btn"
      [loading]="loading"
      [disabled]="loading"
      (onClick)="guardarLiquidacion()"
    >
    </p-button>
  </div>
</div>
