<div class="login-container">
  <div class="login-card">
    <img
      src="https://sosamet.com/wp-content/uploads/2025/02/cropped-logo-completo-blanco-216x33.png"
      alt="Logo"
      class="logo"
    />

    <h2 class="login-title">Recuperar contraseña</h2>
    <p class="forgot-hint">
      Ingresa el correo de tu cuenta. Si está registrado, te enviaremos un enlace válido por 24 horas.
    </p>

    <p-floatLabel>
      <input id="email" type="email" pInputText [(ngModel)]="email" autocomplete="email" />
      <label for="email">Correo electrónico</label>
    </p-floatLabel>

    <button
      pButton
      type="button"
      label="Enviar enlace"
      class="button"
      [loading]="sending"
      [disabled]="sending"
      (click)="submit()"
    ></button>

    <a class="back-login" routerLink="/">Volver al inicio de sesión</a>
  </div>
</div>
