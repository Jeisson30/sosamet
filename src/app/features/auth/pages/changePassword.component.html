<div class="user-card">
  <h2 class="login-title">Crear / recuperar contraseña</h2>

  <div class="form-column">
    <p-floatlabel class="form-field">
      <p-password
        [feedback]="false"
        toggleMask="true"
        [(ngModel)]="newPassword"
        inputId="newPassword"
        styleClass="w-full"
        inputStyleClass="w-full"
      ></p-password>
      <label for="newPassword">Nueva contraseña</label>
    </p-floatlabel>

    <ul class="pwd-reqs" aria-live="polite">
      <li
        *ngFor="let req of requirements"
        class="pwd-req"
        [class.pwd-req--ok]="passwordChecks[req.key]"
      >
        <span class="pwd-req__mark">{{ passwordChecks[req.key] ? 'OK' : '—' }}</span>
        <span>{{ req.label }}</span>
      </li>
    </ul>

    <p-floatlabel class="form-field">
      <p-password
        [feedback]="false"
        toggleMask="true"
        [(ngModel)]="confirmPassword"
        inputId="confirmPassword"
        styleClass="w-full"
        inputStyleClass="w-full"
      ></p-password>
      <label for="confirmPassword">Confirmar contraseña</label>
    </p-floatlabel>
  </div>

  <div class="actions">
    <button
      pButton
      type="button"
      label="Guardar contraseña"
      class="button"
      [loading]="submitting"
      [disabled]="submitting || !allRequirementsMet"
      (click)="onSubmit()"
    ></button>
    <a class="back-login" routerLink="/">Volver al inicio de sesión</a>
  </div>
</div>
