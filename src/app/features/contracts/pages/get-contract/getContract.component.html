<div class="contratos-hub">
  <header class="contratos-hub-header">
    <h1 class="contratos-greeting">
      Hola, <span>{{ nombreUsuario }}</span>!
    </h1>
    <p class="contratos-subtitle">Gestiona el proceso de contratos</p>
  </header>

  <p class="contratos-loading" *ngIf="loading">Cargando módulos…</p>

  <div class="contratos-grid" *ngIf="!loading">
    <article class="contrato-card" *ngFor="let card of cards">
      <div class="contrato-card-icon-wrap">
        <img
          class="contrato-card-icon"
          [src]="card.icon"
          [alt]="card.title"
          (error)="onIconError($event)"
        />
      </div>

      <h2 class="contrato-card-title">{{ card.title }}</h2>

      <div class="contrato-card-actions">
        <button
          *ngIf="card.showNuevo !== false"
          type="button"
          class="btn-card btn-card-nuevo"
          (click)="onNuevo(card)"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-plus"></i>
          </span>
          <span>Nuevo</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>

        <button
          type="button"
          class="btn-card btn-card-consultar"
          (click)="onConsultar(card)"
        >
          <span class="btn-card-icon" aria-hidden="true">
            <i class="pi pi-search"></i>
          </span>
          <span>Consultar</span>
          <i class="pi pi-chevron-right btn-card-chevron" aria-hidden="true"></i>
        </button>
      </div>
    </article>
  </div>

  <p class="contratos-empty" *ngIf="!loading && !cards.length">
    No hay módulos de contrato disponibles para su perfil.
  </p>
</div>
