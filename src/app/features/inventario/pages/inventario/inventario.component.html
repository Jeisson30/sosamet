<div class="inventario-hub">
  <header class="inventario-hub-header">
    <h1 class="inventario-title">Inventario</h1>
    <p class="inventario-subtitle">Módulo de inventarios</p>
  </header>

  <div class="inventario-grid">
    <article class="inventario-card">
      <div class="inventario-card-icon-wrap">
        <img
          class="inventario-card-icon"
          src="assets/images/MODULO INVENTARIO.png"
          alt="Inventario"
          (error)="onIconError($event)"
        />
      </div>
      <h2 class="inventario-card-title">Próximamente</h2>
      <p class="inventario-card-desc">
        Este módulo estará disponible en una próxima actualización.
      </p>
    </article>
  </div>
</div>
